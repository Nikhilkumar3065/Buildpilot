<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildPilot - Sign Up</title>
</head>
<body>
    <h1>Create your BuildPilot account</h1>
    <p>Start building software with AI.</p>

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        {{ form.username }}
        {{ form.username.errors }}

        <br><br>

        <label>Password</label>
        {{ form.password1 }}
        {{ form.password1.errors }}

        <br><br>

        <label>Confirm Password</label>
        {{ form.password2 }}
        {{ form.password2.errors }}

        <br><br>

        <label>Workspace Name</label>
        <input
            type="text"
            name="workspace_name"
            placeholder="Enter workspace name"
            required
        >

        <br><br>

        <button type="submit">Create Account</button>
    </form>
</body>
</html>
